<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Отечество</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <div class="login-header">
                <span class="login-logo">◆</span>
                <h1>Админ-панель</h1>
                <p>АНО ДОВ ЦДНВ «Отечество»</p>
            </div>
            <form id="login-form" class="login-form">
                <input type="password" name="password" placeholder="Пароль" required autocomplete="current-password">
                <button type="submit">Войти</button>
                <p id="login-error" class="login-error"></p>
            </form>
        </div>
    </div>

    <div id="admin-app" class="admin-app hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">◆</span>
                <span class="sidebar-title">Отечество</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="news">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    Новости
                </a>
                <a href="#" class="nav-item" data-page="stats">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 19h16v2H4v-2zm2-2h2V7H6v10zm4 0h2V4h-2v13zm4 0h2V10h-2v7zm4 0h2V13h-2v4z"/></svg>
                    Статистика
                </a>
                <a href="/" class="nav-item" target="_blank">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    На сайт
                </a>
            </nav>
            <div class="sidebar-footer">
                <button type="button" id="logout-btn" class="logout-btn">Выйти</button>
            </div>
        </aside>

        <main class="main">
            <header class="main-header">
                <h2 id="page-title">Новости</h2>
                <button type="button" id="add-news-btn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Добавить новость
                </button>
            </header>

            <div class="content">
                <div id="page-news" class="page">
                    <div class="toolbar">
                        <input id="news-search" type="text" placeholder="Поиск по заголовку или тексту…">
                        <select id="news-status-filter">
                            <option value="all">Все статусы</option>
                            <option value="published">Опубликовано</option>
                            <option value="draft">Черновики</option>
                        </select>
                        <button type="button" id="refresh-news-btn" class="btn btn-secondary">Обновить</button>
                    </div>

                    <div id="news-list" class="news-list"></div>
                    <div id="news-empty" class="empty-state hidden">
                        <svg viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                        <p>Новостей пока нет</p>
                        <button type="button" class="btn btn-primary" onclick="document.getElementById('add-news-btn').click()">Добавить первую новость</button>
                    </div>
                </div>

                <div id="page-stats" class="page hidden">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-total-views">0</div>
                            <div class="stat-label">Просмотров всего</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-today-views">0</div>
                            <div class="stat-label">Сегодня</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-unique-visitors">0</div>
                            <div class="stat-label">Уникальных посетителей</div>
                        </div>
                    </div>

                    <div class="stats-news">
                        <div class="stats-news-row">
                            <div class="stat-pill">
                                Всего новостей: <span id="stat-news-total">0</span>
                            </div>
                            <div class="stat-pill stat-pill-success">
                                Опубликовано: <span id="stat-news-published">0</span>
                            </div>
                            <div class="stat-pill stat-pill-muted">
                                Черновики: <span id="stat-news-drafts">0</span>
                            </div>
                        </div>

                        <div class="section-title">Просмотры (7 дней)</div>
                        <div id="views-chart" class="views-chart"></div>

                        <div class="section-title">Публикации (14 дней)</div>
                        <div id="news-chart" class="news-chart"></div>
                    </div>

                    <div class="recent-news">
                        <div class="section-title">Последние опубликованные</div>
                        <div id="stats-recent-news" class="recent-news-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Добавить новость</h3>
                <button type="button" class="modal-close" aria-label="Закрыть">&times;</button>
            </div>
            <form id="news-form" class="modal-form">
                <input type="hidden" id="news-id">
                <div class="form-group">
                    <label for="news-date">Дата</label>
                    <input type="text" id="news-date" name="date" placeholder="ДД.ММ.ГГГГ" required>
                </div>
                <div class="form-group">
                    <label for="news-title">Заголовок</label>
                    <input type="text" id="news-title" name="title" placeholder="Например: Встреча воспитанников…">
                </div>
                <div class="form-group">
                    <label for="news-status">Статус</label>
                    <select id="news-status" name="status" required>
                        <option value="published">Опубликовано</option>
                        <option value="draft">Черновик</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="news-content">Текст новости</label>
                    <textarea id="news-content" name="content" rows="5" required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary modal-cancel">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/admin.js"></script>
</body>
</html>
